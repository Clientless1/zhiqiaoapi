# Included in the host nginx http context. The public tunnel points to 8091.
# This pool reuses connections to the frontend container without changing
# the Cloudflare route, trusted client-IP boundary or streaming behavior.
upstream zhiqiao_tunnel_frontend {
    server 127.0.0.1:8090;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

map $http_upgrade $zhiqiao_tunnel_connection {
    default upgrade;
    '' '';
}

server {
    listen 127.0.0.1:8091;
    server_name zhiqiaoapi.fun api.zhiqiaoapi.fun;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    server_tokens off;
    include /etc/nginx/snippets/zhiqiao-security.conf;
    client_max_body_size 64m;
    keepalive_timeout 90s;
    access_log /var/log/nginx/zhiqiao-tunnel.access.log zhiqiao_secure;
    error_log /var/log/nginx/zhiqiao-tunnel.error.log;

    location / {
        proxy_pass http://zhiqiao_tunnel_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhiqiao_tunnel_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        send_timeout 1200s;
    }
}
