# Apply the small authentication budget only to authentication endpoints.
map $uri $zhiqiao_auth_key {
    default "";
    ~^/api/(login|login-verification-codes|password-reset|password-reset-requests)/?$ $binary_remote_addr;
}
limit_req_zone $zhiqiao_auth_key zone=zhiqiao_auth:10m rate=10r/m;
limit_conn_zone $zhiqiao_auth_key zone=zhiqiao_auth_connections:10m;

map $status $zhiqiao_retry_after {
    default "";
    429 "60";
}

# Do not record query strings, cookies, Authorization headers, or request bodies.
log_format zhiqiao_secure escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","limit_req_status":"$limit_req_status"}';

server_tokens off;
client_header_timeout 15s;
client_body_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;
