# The production frontend loads its JavaScript from this origin.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header Retry-After $zhiqiao_retry_after always;

# Empty map keys exclude model/API requests from the authentication budget.
limit_req zone=zhiqiao_auth burst=10 nodelay;
limit_req_status 429;
limit_req_log_level warn;
limit_conn zhiqiao_auth_connections 10;
limit_conn_status 429;
error_page 429 = @zhiqiao_auth_rate_limited;

location @zhiqiao_auth_rate_limited {
    default_type application/json;
    return 429 '{"error":{"type":"rate_limit_error","code":"authentication_rate_limited","message":"Too many authentication attempts. Please try again later."}}';
}

# A SPA fallback must never serve hidden configuration or repository paths.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
